name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Release modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_modules.py --release --base-ref "${{ github.event.before }}"
