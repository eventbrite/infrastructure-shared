[project]
name = "infrastructure-shared"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
root = ["."]
